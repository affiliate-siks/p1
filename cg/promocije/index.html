<!doctype html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdmiralBet Promocije</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002157; --navy-2:#0a2c66; --yellow:#ffcb05; --yellow-2:#ffd93d;
  --side:#181a1d; --bg:#000; --card:#16181c; --card-2:#1f2227; --line:#2a2e35;
  --text:#fff; --muted:#a3a9b5; --green:#2fd27a; --red:#ff4d5e;
  --side-w:75px; --top-h:74px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block}

/* ============ SIDEBAR (isti kao original) ============ */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);z-index:60;transition:width .25s ease;overflow:hidden;display:flex;flex-direction:column}
.sidebar.open{width:230px;box-shadow:8px 0 30px rgba(0,0,0,.5)}
.sb-toggle{height:var(--top-h);display:flex;align-items:center;justify-content:flex-start;padding-left:24px;flex-shrink:0;background:var(--navy);border-bottom:1px solid var(--yellow)}
.burger{width:26px;height:18px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2px;background:var(--yellow);border-radius:2px}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:8px}.burger i:nth-child(3){top:16px}
.sb-list{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sb-list::-webkit-scrollbar{display:none}
.sb-item{display:flex;align-items:center;height:45px;margin:8px 0;padding-left:23px;gap:20px;color:#fff;white-space:nowrap;position:relative}
.sb-item .ic{width:30px;display:flex;justify-content:center;flex-shrink:0}
.sb-item svg{max-width:28px;max-height:28px}
.sb-item .lbl{font-size:13px;font-weight:600;opacity:0;transition:opacity .2s}
.sidebar.open .sb-item .lbl{opacity:1}
.sb-item:hover{color:var(--yellow)}
.sb-item.active{color:var(--yellow)}
.sb-item.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--yellow);border-radius:0 3px 3px 0}
.sb-sep{height:1px;background:#2b2e33;margin:12px 14px}

/* ============ TOP NAV (isti kao original) ============ */
.topnav{position:fixed;top:0;left:var(--side-w);right:0;height:var(--top-h);background:var(--navy);border-bottom:1px solid var(--yellow);display:flex;align-items:center;padding:0 24px 0 36px;z-index:50}
.logo{display:flex;align-items:center;margin-right:24px;flex-shrink:0}
.logo img{width:105px;height:27px}
.logo .fallback{font-weight:900;font-style:italic;color:var(--yellow);letter-spacing:-.5px;font-size:18px}
.nav-links{display:flex;align-items:stretch;height:100%;overflow:hidden}
.nav-links a{display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;font-weight:700;white-space:nowrap;color:#fff;transition:color .15s}
.nav-links a:hover,.nav-links a.active{color:var(--yellow)}
.nav-links svg{width:20px;height:16px}
.nav-right{margin-left:auto;display:flex;gap:18px;align-items:center}
.hdr-btn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:500;color:#fff}
.hdr-btn svg{width:15px;height:15px}
.hdr-btn:hover{color:var(--yellow)}
.m-burger{display:none;margin-right:16px}

/* ============ MAIN ============ */
.main{margin-left:var(--side-w);padding-top:var(--top-h);min-height:100vh;position:relative}
.main::before{content:"";position:absolute;inset:var(--top-h) 0 auto 0;height:520px;background:radial-gradient(900px 380px at 30% -10%,rgba(0,58,150,.55),transparent 70%),radial-gradient(500px 260px at 85% 0%,rgba(255,203,5,.10),transparent 70%);pointer-events:none}
.wrap{position:relative;max-width:1320px;margin:0 auto;padding:22px 32px 48px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px 32px}

.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--yellow);text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(255,203,5,.18)}
.head h1{font-size:30px;font-weight:900;line-height:1.1;margin-top:8px;letter-spacing:-.5px}
.head h1 em{font-style:normal;color:var(--yellow)}
.head p{color:var(--muted);margin-top:6px;font-size:14px;line-height:1.5}

.view-toggle{display:flex;background:#111317;border:1px solid var(--line);border-radius:12px;padding:4px}
.view-toggle button{padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:7px;align-items:center}
.view-toggle button.on{background:var(--yellow);color:#000}

.filters{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#101216;font-size:13px;font-weight:700;color:#d8dce3;transition:all .15s}
.chip:hover{border-color:#4a5160}
.chip b{font-size:11px;background:#262a31;color:#cfd3da;padding:2px 7px;border-radius:999px}
.chip.on{background:var(--yellow);color:#000;border-color:var(--yellow)}
.chip.on b{background:rgba(0,0,0,.15);color:#000}

.wrap{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:40px}
.all,.all-h>*{min-width:0}

.wrap{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:110px}
.all,.all-h>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;font-weight:800;font-size:13px;letter-spacing:.3px;text-transform:uppercase;transition:transform .1s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-y{background:var(--yellow);color:#000}.btn-y:hover{filter:brightness(1.08)}
.btn-g{background:#22262c;color:#fff}.btn-g:hover{background:#2a2f37}
.btn-o{border:1px solid #3a4150;color:#fff}.btn-o:hover{border-color:#6a7385}
.btn.lg{height:56px;font-size:15px;padding:0 28px;border-radius:14px}
.btn.grow{flex:1}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#22262c;color:#cfd3da}
.tag.hot{background:var(--yellow);color:#000}
.tag.new{background:var(--green);color:#002a12}
.tag.me{background:rgba(255,203,5,.14);color:var(--yellow)}
img.broken{visibility:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none}.scrim.on{display:block}

/* ---------- profil traka ---------- */
.pbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.pbar .ans{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;background:#1a1e24;border:1px solid #2a2f37}
.pbar button{font-size:12px;font-weight:700;color:var(--muted);text-decoration:underline;margin-left:4px}
.pbar button:hover{color:#fff}
.pnote{font-size:12px;font-weight:700;color:var(--green);margin-left:6px}
.plogin{margin-left:auto;font-size:13px;font-weight:800;color:var(--yellow)}

/* ---------- onboarding ---------- */
.onb{display:flex;flex-direction:column;align-items:center;padding:10px 0 40px}
.deck{position:relative;width:100%;max-width:460px;height:340px}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);user-select:none;touch-action:pan-y;will-change:transform;transform-origin:50% 90%;cursor:grab;background:radial-gradient(500px 300px at 50% -10%,#123a8a,#0b1020 70%)}
.card.anim{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.card .q{font-size:26px;font-weight:900;text-align:center;padding:26px 20px 0}
.q-opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
.opt{border-radius:18px;border:2px solid #2a3550;background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s,opacity .15s}
.opt:hover{border-color:#4a5a80}
.opt .em{color:var(--yellow)}.opt .em svg{width:48px;height:48px}
.opt b{font-size:18px;font-weight:900}
.opt.hl{border-color:var(--yellow);background:rgba(255,203,5,.1);transform:scale(1.03)}
.opt.dim{opacity:.4}
.q-hint{display:flex;justify-content:space-between;padding:0 22px 16px;font-size:11px;font-weight:700;color:#6f7683}
.skip{margin-top:16px;font-size:13px;font-weight:700;color:var(--muted)}
.skip:hover{color:#fff}

/* ---------- nov igrac ---------- */
.pk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:56px;align-items:center;padding:8px 0 44px}
.h-title{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.slider{margin-top:26px;max-width:460px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.slider label b{color:#fff;font-size:18px;font-weight:900}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--yellow) var(--p,20%),#262a31 var(--p,20%));outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid var(--yellow);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:6px solid var(--yellow);cursor:pointer}
.ends{display:flex;justify-content:space-between;font-size:11px;color:#6f7683;font-weight:700;margin-top:6px}
.total{margin-top:26px;display:flex;align-items:center;gap:14px}
.total .num{font-size:72px;font-weight:900;color:var(--yellow);letter-spacing:-2px;line-height:1}
.total .plus{font-size:16px;font-weight:800;line-height:1.25}
.r-sub{margin-top:6px;font-size:13px;color:var(--muted);font-weight:600}
.cta-row{display:flex;align-items:center;gap:20px;margin-top:24px}
.btn.lg{height:56px;font-size:15px;padding:0 44px;border-radius:14px}
.terms{font-size:13px;color:var(--muted);font-weight:700;text-decoration:underline}
.terms:hover{color:#fff}
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:16px;background:#111418;border:1px solid #22262c}
.rung .n{width:36px;height:36px;border-radius:10px;background:#22262c;display:grid;place-items:center;font-weight:900}
.rung b{display:block;font-size:16px;font-weight:800}
.rung small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.rung.focus{border-color:var(--yellow)}
.rung.focus .n{background:var(--yellow);color:#000}
.eq{display:flex;align-items:center;gap:8px;white-space:nowrap}
.eq strong{font-size:22px;font-weight:900}
.eq .max{display:none;font-style:normal;font-size:9px;font-weight:900;letter-spacing:.5px;padding:3px 6px;border-radius:6px;background:var(--yellow);color:#000}
.eq .max.on{display:inline-block}

/* ---------- postojeci igrac ---------- */
.tl{display:flex;flex-direction:column;gap:10px;margin:16px 0 40px}
.ti{display:grid;grid-template-columns:110px 84px 1fr auto;gap:16px;align-items:center;padding:10px 16px 10px 10px;border-radius:16px;background:#111418;border:1px solid #22262c;transition:border-color .2s}
.ti:hover{border-color:var(--yellow)}
.ti .when{font-size:12px;font-weight:800;color:var(--yellow);text-transform:uppercase;padding-left:8px}
.ti img{width:84px;height:50px;border-radius:9px;object-fit:cover;background:#0b1a3a}
.ti .txt{display:flex;align-items:center;gap:10px;min-width:0}
.ti b{font-size:15px;font-weight:800}
.ti .go{font-size:12px;font-weight:800;color:var(--yellow);white-space:nowrap}

/* ---------- sve promocije ---------- */
.all{border-top:1px solid #16191d;padding-top:34px}
.all-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.all-h h2{font-size:24px;font-weight:900}
.all-h h2 em{font-style:normal;color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gcard{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid #23272e;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.gcard:hover{transform:translateY(-3px);border-color:#3a4150}
.gcard .gm{aspect-ratio:430/258;background:#0b1a3a}
.gcard .gm img{width:100%;height:100%;object-fit:cover}
.gcard .gb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.gcard h4{font-size:16px;font-weight:900;line-height:1.25}
.gcard p{color:var(--muted);font-size:13px;line-height:1.5}
.gcard .row{margin-top:auto;display:flex;gap:8px;padding-top:8px}
.gcard .btn{height:40px;font-size:12px;padding:0 14px}
.gcard.me{border-color:rgba(255,203,5,.4)}
.rg{display:flex;align-items:center;gap:10px;color:#6f7683;font-size:11px;font-weight:600;border-top:1px solid #16191d;padding-top:18px;margin-top:34px}
.rg .b18{width:28px;height:28px;border-radius:50%;border:2px solid #6f7683;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}

/* ---------- sticky registracija ---------- */
.sticky{position:fixed;left:var(--side-w);right:0;bottom:0;z-index:45;background:rgba(0,20,58,.96);backdrop-filter:blur(10px);border-top:1px solid var(--yellow);padding:12px 32px;display:none;align-items:center;gap:16px;transform:translateY(100%);transition:transform .3s}
.sticky.on{display:flex}.sticky.up{transform:none}
.sticky .t{flex:1;min-width:0;font-size:14px;font-weight:700}
.sticky .t b{color:var(--yellow)}
.sticky .t small{display:block;color:#a9b6cf;font-size:12px;font-weight:600;margin-top:2px}
.sticky .x{color:#a9b6cf;font-size:18px;padding:6px}

/* ---------- responsive ---------- */
@media (max-width:1280px){.nav-links a{padding:0 7px;font-size:11px}.nav-links svg{display:none}}
@media (max-width:1120px){
  .nav-links{display:none}
  .pk{grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:28px}
  .total .num{font-size:54px}
}
@media (max-width:900px){
  .pk{grid-template-columns:minmax(0,1fr);gap:28px}
  .slider{max-width:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr;gap:12px}
  .gcard{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:12px;border-radius:16px;padding:12px}
  .gcard:hover{transform:none}
  .gcard .gm{grid-column:1;grid-row:1/4;align-self:start;border-radius:10px;overflow:hidden;aspect-ratio:430/258}
  .gcard .gb{display:contents}
  .gcard .tags{grid-column:2;grid-row:1;min-height:0}
  .gcard .tags:empty{display:none}
  .gcard .tags .tag:not(.me):not(.new){display:none}
  .gcard h4{grid-column:2;grid-row:2;font-size:14px;line-height:1.2;margin-top:2px}
  .gcard p{grid-column:2;grid-row:3;font-size:12px;line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gcard .row{grid-column:1/-1;grid-row:4;margin-top:12px;padding-top:0}
  .gcard .btn{height:40px;font-size:12px;padding:0 14px}
  .tl .ti{grid-template-columns:110px 1fr;gap:4px 12px}.tl .ti img{width:110px;height:66px}
  .total .num{font-size:56px}
  .rung{padding:12px 14px}
  .cta-row{flex-direction:column;align-items:stretch;gap:12px}.cta-row .terms{text-align:center}
  .ti{padding:8px}
}
@media (max-width:860px){
  .ti{grid-template-columns:72px 1fr;gap:4px 12px}.ti img{grid-row:1/3;width:72px;height:43px}.ti .when{padding:0;font-size:11px}.ti .go{display:none}
}
@media (max-width:768px){
  :root{--top-h:64px}
  .sidebar{transform:translateX(-100%);width:240px;transition:transform .25s}
  .sidebar.open{transform:none;width:240px}
  .sidebar .sb-item .lbl{opacity:1}
  .topnav{left:0;padding:0 16px}
  .m-burger{display:block}
  .main{margin-left:0}
  .wrap{padding:16px 16px 120px}
  .deck{height:300px}.card .q{font-size:22px}
  .total .num{font-size:56px}.btn.lg{width:100%}
  .h-title{font-size:24px}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}.chip{flex-shrink:0}
  .all-h{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
  .sticky{left:0;padding:10px 16px}
  .sticky .t small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar" aria-label="Glavni meni">
  <div class="sb-toggle"><button class="burger" id="sbToggle" aria-label="Otvori meni"><i></i><i></i><i></i></button></div>
  <div class="sb-list" id="sbList"></div>
</nav>
<div class="scrim" id="scrim"></div>

<!-- TOP NAV -->
<header class="topnav">
  <button class="burger m-burger" id="mBurger" aria-label="Meni"><i></i><i></i><i></i></button>
  <a href="https://admiralbet.me/" class="logo"><img src="https://admiralbet.me/assets/images/cms/LsQ5AJm.svg" alt="AdmiralBet logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'ADMIRALBET'}))"></a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-right">
    <a class="hdr-btn" href="https://admiralbet.me/login"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="5"/><path d="M2 23c0-5.5 4.5-9 10-9s10 3.5 10 9z"/></svg>Prijava</a>
    <a class="hdr-btn" href="https://admiralbet.me/registration"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="10" cy="7" r="5"/><path d="M0 23c0-5.5 4.5-9 10-9 2 0 3.8.5 5.3 1.3A6 6 0 0 0 14 23z"/><path d="M19 13h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/></svg>Registracija</a>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <div class="wrap">
    <section id="hero"></section>
    <section class="all" id="all">
      <div class="all-h">
        <h2>Sve <em>promocije</em></h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="rg"><span class="b18">18+</span>Igre na sreću mogu izazvati zavisnost. Igraj odgovorno. Učešće je dozvoljeno samo punoljetnim licima. Detaljni uslovi svake promocije nalaze se na stranici promocije.</div>
    </section>
  </div>
</main>

<div class="sticky" id="sticky"></div>



<script>

 {id:'viber',slug:'od-sada-i-na-viberu-1362',t:'OD SADA I NA VIBERU',img:'faesgrdtjfkuglizukzjthg.jpg',cats:['Ostalo'],hot:'Zajednica',cta:'PRIDRUŽI SE!',
  d:['AdmiralBET je pokrenuo svoju zvaničnu zajednicu na Viber-u!','Pridruži se i prvi/a saznaj za sve novitete i promocije!'],why:'Prvi saznaj za nove promocije.',k:['Zvanična Viber zajednica']},
 {id:'telegram',slug:'od-sada-i-na-telegramu-1507',t:'OD SADA I NA TELEGRAMU',img:'zkuliuizktrhgewf.jpg',cats:['Ostalo'],hot:'Zajednica',cta:'PRIDRUŽI SE!',
  d:['Pridruži nam se na zvaničnom AdmiralBET Telegram kanalu!','Neka ti nijedna važna novost ne promakne!'],why:'Prvi saznaj za nove promocije.',k:['Zvanični Telegram kanal']}
];
/* link na stranicu promocije (Info) i link za CTA dugme */
PROMOS.forEach(p=>{p.url=p.slug?'/promotions/'+p.slug:'/promotions';p.go=p.ctaUrl||p.url});

const CATS=['Sve','Sport','Slot','Virtuali','Ostalo'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>PROMOS.find(p=>p.id===id);
const ctaLabel=p=>p.cta||'SAZNAJ VIŠE';

/* ==================== GA4 / GTM ==================== */
window.dataLayer=window.dataLayer||[];
const track=(event,params={})=>dataLayer.push({event,...params,promo_segment:prof.v||'unknown',promo_player:prof.p||'unknown'});

/* ==================== PAMĆENJE (kolačić + localStorage rezerva) ====================
   Kolačić "ab_promo" (90 dana): segment, tip igrača, izvor odgovora, broj posjeta,
   viđene promocije, izabrani iznos u kalkulatoru i da li je kliknuo registraciju.
   Ovo je funkcionalni/preferencijalni kolačić – upisivati ga tek nakon pristanka na kolačiće. */
const STORE='ab_promo', DAYS=90;
function loadProf(){
  try{const m=document.cookie.match(new RegExp('(?:^|; )'+STORE+'=([^;]*)'));if(m)return JSON.parse(decodeURIComponent(m[1]))}catch(e){}
  try{const v=localStorage.getItem(STORE);if(v)return JSON.parse(v)}catch(e){}
  return null;
}
function saveProf(){
  const v=JSON.stringify(prof);
  try{document.cookie=`${STORE}=${encodeURIComponent(v)}; max-age=${DAYS*86400}; path=/; SameSite=Lax`}catch(e){}
  try{localStorage.setItem(STORE,v)}catch(e){}
}
function clearProf(){try{document.cookie=`${STORE}=; max-age=0; path=/`}catch(e){}try{localStorage.removeItem(STORE)}catch(e){}}

/* ==================== KO JE POSJETILAC ==================== */
/* Povezati sa stvarnom sesijom sajta: platforma treba da postavi window.AB_LOGGED_IN = true za ulogovanog igrača. */
const isLoggedIn=()=>window.AB_LOGGED_IN===true;
const url=new URL(location.href);
function inferVertical(){
  const pv=(url.searchParams.get('segment')||'').toLowerCase();
  if(pv==='sport'||pv==='casino')return pv;
  const utm=['utm_campaign','utm_content','utm_term','utm_source'].map(k=>url.searchParams.get(k)||'').join(' ').toLowerCase();
  if(/casino|kazino|slot|spin|aviator|jackpot/.test(utm))return 'casino';
  if(/sport|klad|tiket|liga|fudbal|football|kosark|tenis|atp/.test(utm))return 'sport';
  const ref=document.referrer||'';
  if(/\/(casino|casino-live|mini-games)/.test(ref))return 'casino';
  if(/\/sport-(prematch|live)/.test(ref))return 'sport';
  return null;
}
const firstVisit=!loadProf();
let prof=loadProf()||{v:null,p:null,src:null,visits:0,seen:[],amt:50,reg:0,first:Date.now()};
const returning=prof.visits>0;
const prevSeen=new Set(prof.seen||[]);
prof.visits++;prof.last=Date.now();
const vInf=inferVertical();
if(vInf&&vInf!==prof.v){prof.v=vInf;prof.src='utm'}
if(isLoggedIn()){prof.p='existing';prof.src=prof.src||'login'}
saveProf();

/* ==================== VRIJEME (za "tvoju sedmicu") ==================== */
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const D=s=>{const d=new Date(s+'T00:00:00');return d};
const days=d=>Math.round((d-TODAY)/864e5);
const fmt=d=>`${d.getDate()}.${d.getMonth()+1}.`;
const DAYN=['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
function rel(d){const n=days(d);return n===0?'Danas':n===1?'Sjutra':n<7?DAYN[d.getDay()][0].toUpperCase()+DAYN[d.getDay()].slice(1):fmt(d)}
function nextWeekday(wd){const d=new Date(TODAY);d.setDate(d.getDate()+((wd-d.getDay()+7)%7||7));return d}
/* kada promocija važi: sort = koliko je "hitna" (manje = prije), hide = istekla */
const TIMING={
  subota:()=>{const d=D('2026-10-10');const n=days(d);return n<0?{hide:1}:{when:rel(d),sub:'samo terminal u poslovnici',sort:n}},
  sportturnir:()=>{const a=D('2026-10-13'),b=D('2026-11-06');const n=days(a);if(days(b)<0)return{hide:1};return n>0?{when:'Od '+fmt(a),sub:'počinje za '+n+(n===1?' dan':' dana'),sort:n+.5}:{when:'Traje',sub:'do '+fmt(b),sort:0.2}},
  loyalty:()=>{const d=nextWeekday(1);return{when:rel(d),sub:'loyalty bonus do 12h',sort:days(d)+.3}},
  pragmatic:()=>({when:'Svaki dan',sub:'Drops & Wins',sort:0.1}),
  spinoliga:()=>({when:'Svake sedmice',sub:'nova runda',sort:0.4}),
  playson:()=>({when:'Svake sedmice',sub:'Grand Races',sort:0.5}),
  ml6:()=>({when:'U toku',sub:'rang-lista',sort:0.6}),
  rodjendan:()=>({when:'Tvoj rođendan',sub:'10 € na nalog',sort:50}),
  aba:()=>({when:'Svako kolo',sub:'ABA liga',sort:1.1}),
  atp:()=>({when:'ATP 1000',sub:'važi automatski',sort:1.2}),
  nadoknada:()=>({when:'Premier liga',sub:'važi automatski',sort:1.3}),
  predikcije:()=>({when:'Svake sedmice',sub:'besplatno',sort:1.4})
};

/* ==================== SEGMENTI ==================== */
const SEG={
  sport:{name:'Sport',existing:['subota','sportturnir','aba','atp','nadoknada','predikcije','loyalty'],extra:['predikcije','atp','nadoknada','aba','sportturnir'],focus:1},
  casino:{name:'Kazino',existing:['pragmatic','spinoliga','playson','ml6','loyalty','rodjendan'],extra:['pragmatic','spinoliga','playson','ml6'],focus:0}
};
const LABEL={sport:'Sport',casino:'Kazino',new:'Nov igrač',existing:'Imam nalog'};
const myIds=()=>!prof.v||!prof.p?[]:prof.p==='new'?['welcome',...SEG[prof.v].extra]:SEG[prof.v].existing;
const isNew=id=>returning&&!prevSeen.has(id);

/* ==================== BONUS PAKET (pravila sa stranice promocije) ==================== */
const WELCOME=[{pct:100,max:200,type:'slot',spins:500,lbl:'1. depozit'},{pct:150,max:250,type:'sport',lbl:'2. depozit'},{pct:250,max:300,type:'slot',lbl:'3. depozit'}];
const bonusFor=(amt,r)=>Math.min(amt*r.pct/100,r.max);
const totalFor=amt=>WELCOME.reduce((s,r)=>s+bonusFor(amt,r),0);
const regUrl=()=>`${BASE}/registration?promo=welcome&segment=${prof.v||'unknown'}`;

/* ==================== HERO ==================== */
function render(){
  const h=$('hero');
  if(!prof.v||!prof.p){renderOnboarding(h);setSticky(false);return}
  if(prof.p==='new')renderNew(h);else renderExisting(h);
  renderGrid();markSeen();
}
function pbar(extra=''){
  return `<div class="pbar"><span class="ans">${LABEL[prof.v]}</span><span class="ans">${LABEL[prof.p]}</span><button id="bChange">Promijeni</button>${extra}</div>`;
}
function bindPbar(){$('bChange').onclick=()=>{track('promo_profile_change');prof.p=isLoggedIn()?'existing':null;prof.v=null;prof.src=null;saveProf();render();scrollTo({top:0,behavior:'smooth'})}}

/* ---------- 1) Onboarding: jedna kartica, samo pitanja bez odgovora ---------- */
const USER_PLUS='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="10" cy="7" r="5"/><path d="M0 23c0-5.5 4.5-9 10-9 2 0 3.8.5 5.3 1.3A6 6 0 0 0 14 23z"/><path d="M19 13h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/></svg>';
const USER_OK='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="10" cy="7" r="5"/><path d="M0 23c0-5.5 4.5-9 10-9 2 0 3.8.5 5.3 1.3A6 6 0 0 0 14 23z"/><path d="m15.5 18.5 2.3 2.3 4.7-4.7 1.4 1.4-6.1 6.1-3.7-3.7z"/></svg>';
const QS={
  v:{q:'Sport ili kazino?',L:{v:'sport',t:'Sport',ic:ICONS.sport},R:{v:'casino',t:'Kazino',ic:ICONS.casino}},
  p:{q:'Imaš li nalog?',L:{v:'new',t:'Nemam',ic:USER_PLUS},R:{v:'existing',t:'Imam',ic:USER_OK}}
};
function renderOnboarding(h){
  const todo=['p','v'].filter(k=>!prof[k]);
  h.innerHTML=`<div class="onb"><div class="deck" id="deck"></div>
    <button class="skip" id="bSkip">Preskoči</button></div>`;
  $('bSkip').onclick=()=>{track('promo_guide_skip');$('all').scrollIntoView({behavior:'smooth'})};
  renderQuestion(todo);renderGrid();
}
function renderQuestion(todo){
  const key=todo[0],Q=QS[key],deck=$('deck');deck.innerHTML='';
  if(todo.length>1){const b=document.createElement('div');b.className='card';b.style.cssText='transform:translateY(12px) scale(.96);filter:brightness(.55);pointer-events:none';deck.appendChild(b)}
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<h2 class="q">${Q.q}</h2>
   <div class="q-opts"><div class="opt" data-side="L"><div class="em">${Q.L.ic}</div><b>${Q.L.t}</b></div>
   <div class="opt" data-side="R"><div class="em">${Q.R.ic}</div><b>${Q.R.t}</b></div></div>
   <div class="q-hint"><span>← prevuci</span><span>${todo.length>1?'1/2':(firstVisit&&!prof.src?'2/2':'')}</span><span>prevuci →</span></div>`;
  deck.appendChild(el);
  const oL=el.querySelector('[data-side=L]'),oR=el.querySelector('[data-side=R]');
  const hl=dx=>{oL.classList.toggle('hl',dx<-30);oR.classList.toggle('hl',dx>30);oL.classList.toggle('dim',dx>30);oR.classList.toggle('dim',dx<-30)};
  const pick=side=>{
    prof[key]=Q[side].v;prof.src=prof.src||'swipe';saveProf();
    track('promo_guide_answer',{question:key==='v'?'vertical':'player',answer:Q[side].v});
    fly(el,side==='R'?1:-1);
    setTimeout(()=>{if(prof.v&&prof.p){track('promo_guide_complete',{source:prof.src});render()}else renderQuestion(todo.slice(1))},260);
  };
  swipeable(el,{onMove:hl,onCancel:()=>hl(0),onSwipe:d=>pick(d>0?'R':'L'),onTap:t=>{const o=t.closest('.opt');if(o)pick(o.dataset.side)}});
  window.onkeydown=e=>{if(!document.body.contains(el))return;if(e.key==='ArrowLeft')pick('L');if(e.key==='ArrowRight')pick('R')};
}
function swipeable(el,{onMove,onSwipe,onTap,onCancel}){
  let sx=0,sy=0,dx=0,drag=false,moved=false,downT=null;
  el.addEventListener('pointerdown',e=>{drag=true;moved=false;downT=e.target;sx=e.clientX;sy=e.clientY;dx=0;el.classList.remove('anim')});
  el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;const dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){moved=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}
    if(!moved)return;el.style.transform=`translate(${dx}px,${dy*.15}px) rotate(${dx/20}deg)`;onMove&&onMove(dx)});
  const end=()=>{if(!drag)return;drag=false;if(!moved)return;
    if(Math.abs(dx)>el.offsetWidth*.28)onSwipe(dx>0?1:-1);else{el.classList.add('anim');el.style.transform='';onCancel&&onCancel()}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('click',()=>{if(!moved&&onTap)onTap(downT)});
}
function fly(el,dir){el.classList.add('anim');el.style.transform=`translate(${dir*innerWidth}px,40px) rotate(${dir*25}deg)`}

/* ---------- 2) Nov igrač: bonus dobrodošlice (pravila sa stranice promocije) ---------- */
const eur=n=>(Number.isInteger(n)?n:n.toFixed(2).replace('.',','))+' €';
function renderNew(h){
  const S=SEG[prof.v];
  h.innerHTML=`${pbar(returning&&!firstVisit?'<span class="pnote">Tvoj bonus i dalje važi</span>':'')}
  <div class="pk">
    <div class="pk-l">
      <h1 class="h-title">Bonus dobrodošlice</h1>
      <div class="slider">
        <label for="amt">Depozit <b id="aLbl"></b></label>
        <input type="range" min="10" max="200" step="5" id="amt">
        <div class="ends"><span>10 €</span><span>200 €</span></div>
      </div>
      <div class="total"><span class="num" id="tNum">0 €</span><span class="plus">bonusa<br>+ 500 spinova</span></div>
      <p class="r-sub" id="rSub"></p>
      <div class="cta-row"><a class="btn btn-y lg" id="regCta" href="${regUrl()}" target="_blank" rel="noopener">Registruj se</a>
        <a class="terms" href="${BASE+byId('welcome').url}" target="_blank" rel="noopener">Uslovi</a></div>
    </div>
    <div class="ladder">
      ${WELCOME.map((r,i)=>`<div class="rung${i===S.focus?' focus':''}"><span class="n">${i+1}</span>
        <div><b>${r.pct}% ${r.type==='sport'?'sport':'slot'}</b><small>${i+1}. depozit${r.spins?' · + 500 spinova':''}</small></div>
        <div class="eq"><em class="max" data-m="${i}">MAX</em><strong data-r="${i}"></strong></div></div>`).join('')}
    </div>
  </div>`;
  bindPbar();
  const inp=$('amt');inp.value=prof.amt||50;
  const upd=fromUser=>{
    const a=+inp.value;prof.amt=a;
    inp.style.setProperty('--p',((a-10)/190*100)+'%');
    $('aLbl').textContent=a+' €';
    const t=totalFor(a);$('tNum').textContent=eur(t);
    $('rSub').textContent=a>=200?'Maksimalni bonus':`za 3 depozita po ${a} €`;
    WELCOME.forEach((r,i)=>{h.querySelector(`[data-r="${i}"]`).textContent=eur(bonusFor(a,r));
      h.querySelector(`[data-m="${i}"]`).classList.toggle('on',a*r.pct/100>=r.max)});
    setSticky(true,t);
    if(fromUser){saveProf();clearTimeout(upd.t);upd.t=setTimeout(()=>track('promo_calc_change',{amount:a,bonus_total:t}),600)}
  };
  inp.oninput=()=>upd(true);upd(false);
  $('regCta').onclick=()=>regClick('hero');
  track('promo_welcome_view',{amount:prof.amt});
}
function regClick(where){prof.reg=1;saveProf();track('promo_register_click',{placement:where,amount:prof.amt,bonus_total:totalFor(prof.amt)})}

let stickyClosed=false;
function setSticky(on,total){
  const s=$('sticky');
  if(!on||stickyClosed||prof.p!=='new'){s.classList.remove('on','up');return}
  s.innerHTML=`<div class="t"><b>${eur(total)} bonusa + 500 spinova</b></div>
   <a class="btn btn-y" href="${regUrl()}" target="_blank" rel="noopener" id="stCta">Registruj se</a><button class="x" id="stX" aria-label="Zatvori">✕</button>`;
  s.classList.add('on');requestAnimationFrame(()=>s.classList.toggle('up',stickyShouldShow()));
  $('stCta').onclick=()=>regClick('sticky');
  $('stX').onclick=()=>{stickyClosed=true;s.classList.remove('up');track('promo_sticky_close')};
}
function stickyShouldShow(){const c=$('regCta');if(!c)return true;const r=c.getBoundingClientRect();return r.bottom<0||r.top>innerHeight}
addEventListener('scroll',()=>{const s=$('sticky');if(s.classList.contains('on')&&!stickyClosed)s.classList.toggle('up',stickyShouldShow())},{passive:true});

/* ---------- 3) Postojeći igrač: ove sedmice ---------- */
function renderExisting(h){
  const S=SEG[prof.v];
  const items=S.existing.map(id=>({p:byId(id),tm:(TIMING[id]||(()=>({when:'',sort:9})))()})).filter(x=>!x.tm.hide).sort((a,b)=>a.tm.sort-b.tm.sort).slice(0,5);
  h.innerHTML=`${pbar(isLoggedIn()?'':`<a class="plogin" href="${BASE}/login" target="_blank" rel="noopener" id="loginCta">Prijava</a>`)}
  <h1 class="h-title">Ove sedmice</h1>
  <div class="tl">${items.map(({p,tm})=>`<a class="ti" href="${BASE+p.go}" target="_blank" rel="noopener" data-id="${p.id}">
      <span class="when">${esc(tm.when)}</span>
      <img src="${IMG+p.img}" alt="" loading="lazy" referrerpolicy="no-referrer">
      <span class="txt"><b>${esc(p.t)}</b>${isNew(p.id)?'<span class="tag new">Novo</span>':''}</span>
      <span class="go">${ctaLabel(p).replace('!','')} →</span></a>`).join('')}</div>`;
  bindPbar();
  h.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>track('promo_cta_click',{promo_id:a.dataset.id,source:'week'}));
  const lc=$('loginCta');if(lc)lc.onclick=()=>track('promo_login_click');
  setSticky(false);
  track('promo_week_view',{items:items.length});
}
const whyOf=p=>typeof p.why==='string'?p.why:(p.why[prof.v]||Object.values(p.why)[0]);

/* ==================== SVE PROMOCIJE ==================== */
let cat='Sve';
const inCat=(p,c)=>c==='Sve'||p.cats.includes(c);
function gcard(p,o={}){
  const mine=myIds().includes(p.id);
  const cta=o.reg?{l:'Registruj se',h:regUrl(),r:1}:{l:ctaLabel(p),h:BASE+p.go};
  return `<article class="gcard${mine&&!o.reg?' me':''}"><div class="gm"><img src="${IMG+p.img}" alt="${esc(p.t)}" loading="lazy" referrerpolicy="no-referrer"></div>
   <div class="gb"><div class="tags">${isNew(p.id)?'<span class="tag new">Novo</span>':''}${mine&&!o.reg?'<span class="tag me">Za tebe</span>':''}<span class="tag">${esc(p.hot)}</span></div>
   <h4>${esc(p.t)}</h4><p>${esc(prof.v?whyOf(p):p.d[0])}</p>
   <div class="row"><a class="btn btn-g" href="${BASE+p.url}" target="_blank" rel="noopener">Info</a><a class="btn btn-y grow" href="${cta.h}" target="_blank" rel="noopener" ${cta.r?`data-regcta="${p.id}"`:`data-id="${p.id}"`}>${cta.l}</a></div></div></article>`;
}
function renderFilters(){$('filters').innerHTML=CATS.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}">${c}<b>${PROMOS.filter(p=>inCat(p,c)).length}</b></button>`).join('')}
$('filters').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;renderFilters();renderGrid();track('promo_filter',{filter:cat})};
function renderGrid(){
  const mine=myIds();
  const list=PROMOS.filter(p=>inCat(p,cat)).sort((a,b)=>(mine.includes(b.id)-mine.includes(a.id))||(isNew(b.id)-isNew(a.id)));
  $('grid').innerHTML=list.map(p=>gcard(p)).join('');
}
$('grid').onclick=e=>{const a=e.target.closest('[data-id]');if(a)track('promo_cta_click',{promo_id:a.dataset.id,source:'grid'})};
function markSeen(){prof.seen=PROMOS.map(p=>p.id);saveProf()}

document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&!e.target.closest('.logo'))e.target.classList.add('broken')},true);
track('promo_page_view',{returning,first_visit:firstVisit,source:prof.src||'none'});
renderFilters();render();

</script>
</body>
</html>
